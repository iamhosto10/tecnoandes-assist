[project]
name = "tecnoandes-backend"
version = "0.1.0"
description = "Motor RAG, confianza y revisión humana para TecnoAndes Assist"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "anthropic>=0.40",
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

# App, not a distributable library: no build backend, no src layout.
[tool.uv]
package = false

# El wheel manylinux de torch por defecto arrastra ~2GB de paquetes nvidia-*
# (soporte CUDA) que nunca se usan aquí (embeddings corren en CPU). En Linux
# (la imagen Docker) se fuerza el índice CPU-only de PyTorch; en macOS local
# el wheel nativo ya no trae esas dependencias, así que no hace falta.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
