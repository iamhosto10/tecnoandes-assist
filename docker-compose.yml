services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tecnoandes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-tecnoandes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tecnoandes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Dentro de la red de Docker el host de la DB es el nombre del servicio, no localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tecnoandes}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-tecnoandes}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Volumen anónimo: protege el venv horneado en la imagen de que el bind
      # mount de arriba lo tape con un backend/.venv del host (que puede ser
      # de otro SO/arquitectura). A diferencia de un volumen con nombre, uno
      # anónimo se recrea limpio cada vez que el contenedor se reconstruye,
      # así que nunca arrastra dependencias de una build anterior.
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
